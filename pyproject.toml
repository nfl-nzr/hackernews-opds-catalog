[project]
name = "xtpages"
version = "1.0.0"
description = "Daily Hacker News digests as EPUB, published behind an OPDS catalog"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "curl-cffi>=0.7",   # browser TLS fingerprint; see SPEC 6.4
    "trafilatura>=2.2",
    "ebooklib>=0.20",
    "nh3>=0.2",
    "pyyaml>=6.0",
    "lxml>=5.0",
]

[project.scripts]
xtpages = "xtpages.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xtpages"]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = ["live: hits the network; deselected by default (section 14.2)"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Markdown is documentation, not source: ruff formats Python blocks inside .md
# files, which churns SPEC.md's illustrative signatures for no benefit.
extend-exclude = ["*.md", ".opencode"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
